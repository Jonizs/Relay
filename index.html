<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Relay</title>
    <style>
      html, body { margin: 0; padding: 0; background: #0f0f14; overflow: hidden; font-family: monospace; color: #e8e8e8; }
      #game { width: 100vw; height: 100vh; display: flex; align-items: center; justify-content: center; }
      #gate { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; background: #0f0f14; }
      #gate[hidden] { display: none; }
      #gate form { background: #1a1d24; border: 2px solid #3a4050; padding: 32px 36px; border-radius: 10px; width: 320px; }
      #gate h1 { margin: 0 0 6px; font-size: 22px; }
      #gate p { margin: 0 0 18px; color: #9aa0ad; font-size: 13px; }
      #gate input { width: 100%; box-sizing: border-box; padding: 10px 12px; font: inherit; font-size: 16px; background: #0f0f14; color: #e8e8e8; border: 2px solid #3a4050; border-radius: 6px; outline: none; }
      #gate input:focus { border-color: #ffe066; }
      #gate button { margin-top: 14px; width: 100%; padding: 10px; font: inherit; font-weight: bold; font-size: 15px; color: #0f0f14; background: #ffe066; border: 0; border-radius: 6px; cursor: pointer; }
      #gate-error { min-height: 18px; margin-top: 10px; color: #ff5a5a; font-size: 13px; }
    </style>
  </head>
  <body>
    <div id="gate" hidden>
      <form id="gate-form" autocomplete="off">
        <h1>Relay — closed beta</h1>
        <p>Enter the tester password to continue.</p>
        <input id="gate-input" type="password" placeholder="Password" />
        <div id="gate-error"></div>
        <button type="submit">Enter</button>
      </form>
    </div>
    <div id="game"></div>
    <script type="module" src="/src/gate.ts"></script>
  </body>
</html>
